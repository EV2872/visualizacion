<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Práctica 3/4 - Visualizaciones Canarias</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: auto; padding: 40px; background-color: #f4f7f6; }
    h1 { color: #2c3e50; border-bottom: 2px solid #2196F3; padding-bottom: 10px; }
    h2 { color: #34495e; margin-top: 40px; background: #e3f2fd; padding: 10px; border-radius: 4px; }
    .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
    img { display: block; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 4px; max-width: 100%; height: auto; }
    .back { display: inline-block; margin-bottom: 20px; color: #2196F3; text-decoration: none; font-weight: bold; }
    .back:hover { text-decoration: underline; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Volver al inicio</a>
    <h1>Práctica 3/4: Análisis de Datos Regionales</h1>

    <h2>1. Visualizaciones Generales (IA)</h2>
    <div class="grid">
      <img src="graficos_practica3/visualizacion_ia_canarias.png" alt="Canarias IA">
      <img src="graficos_practica3/visualizacion_ia_islas.png" alt="Islas IA">
      <img src="graficos_practica3/visualizacion_ia_provincias.png" alt="Provincias IA">
      <img src="graficos_practica3/visualizacion_ia_estudios.png" alt="Estudios IA">
    </div>

    <h2>2. Evolución de la Renta</h2>
    <img src="graficos_practica3/evolucion_renta_canarias.png" width="800">
    <div class="grid">
      <img src="graficos_practica3/evolucion_renta_gran_canaria.png" alt="Renta Gran Canaria">
      <img src="graficos_practica3/evolucion_renta_tenerife.png" alt="Renta Tenerife">
    </div>

    <h2>3. Composición de Renta (Áreas Apiladas)</h2>
    <img src="graficos_practica3/area_apilada_renta_canarias.png" width="800">
    <div class="grid">
      <img src="graficos_practica3/area_apilada_renta_grancanaria.png" alt="Área Gran Canaria">
      <img src="graficos_practica3/area_apilada_renta_tenerife.png" alt="Área Tenerife">
    </div>

    <h2>4. Mapas y Análisis Específico</h2>
    <img src="graficos_practica3/mapa_paro_municipios.png" width="800" alt="Mapa Paro">
    <img src="graficos_practica3/heatmap_sueldos_municipios_gomera.png" width="800" alt="Heatmap Gomera">
    <img src="graficos_practica3/barras_nivel_estudios_mujeres.png" width="800" alt="Estudios Mujeres">
  </div>
</body>
</html>
